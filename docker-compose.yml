services:
  db:
    image: postgres:17-alpine
    container_name: petsitterhub-db
    environment:
      POSTGRES_DB: petsitterhub
      POSTGRES_USER: petsitterhub
      POSTGRES_PASSWORD: petsitterhub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsitterhub -d petsitterhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: petsitterhub-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://petsitterhub:petsitterhub@db:5432/petsitterhub
      JWT_SECRET: dev-secret
      FRONTEND_ORIGIN: http://localhost:5500
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: petsitterhub-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
