<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">PetSitterHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="mainNavbarLinks">
                    <li class="nav-item"><a class="nav-link" href="#search">Cerca sitter</a></li>
                    <li class="nav-item"><a class="nav-link" href="pages/services.html">Servizi</a></li>
                </ul>
                <div id="navbarActions" class="d-flex gap-2 ms-lg-3"></div>
            </div>
        </div>
    </nav>
    <header class="hero">
        <div class="container">
            <h1>PetSitterHub</h1>
            <p>Trova pet-sitter e dog-walker nella tua zona.</p>
            <a class="btn btn-light" href="#search">Cerca un sitter</a>
        </div>
    </header>
    <main class="container my-5">
        <section class="search-section" id="search">
            <h2 class="mb-4">Ricerca sitter</h2>
            <form class="row g-3" id="searchForm">
                <div class="col-md-6">
                    <label for="city" class="form-label">Città</label>
                    <input type="text" class="form-control" id="city" placeholder="Es. Roma">
                </div>
                <div class="col-md-6">
                    <label for="service" class="form-label">Servizio</label>
                    <select class="form-select" id="service">
                        <option value="">Tutti i servizi</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Cerca</button>
                    <button type="button" class="btn btn-outline-secondary ms-2" id="resetFilters">Reset filtri</button>
                </div>
            </form>
        </section>
        <section class="mt-5">
            <h2 class="mb-4">Sitter disponibili</h2>
            <div class="row g-4" id="sittersList"></div>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
