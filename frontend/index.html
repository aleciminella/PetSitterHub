<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">PetSitterHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="#">Cerca sitter</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Come funziona</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-lg-2" href="#">Registrati</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <header>
        <h1>PetSitterHub</h1>
        <p>Trova pet-sitter e dog-walker nella tua zona.</p>
    </header>
    <main class="container my-5">
        <section class="search-section">
            <h2 class="mb-4">Ricerca sitter</h2>
            <form class="row g-3" id="searchForm">
                <div class="col-md-3">
                    <label for="city" class="form-label">Citta</label>
                    <input type="text" class="form-control" id="city" placeholder="Es. Roma">
                </div>
                <div class="col-md-3">
                    <label for="petType" class="form-label">Animale</label>
                    <select class="form-select" id="petType">
                        <option value="">Seleziona</option>
                        <option value="dog">Cane</option>
                        <option value="cat">Gatto</option>
                        <option value="other">Altro</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="service" class="form-label">Servizio</label>
                    <select class="form-select" id="service">
                        <option value="">Seleziona</option>
                        <option value="walk">Passeggiata</option>
                        <option value="home">Pet-sitting a domicilio</option>
                        <option value="boarding">Pensione</option>
                        <option value="grooming">Toelettatura base</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="date" class="form-label">Data</label>
                    <input type="date" class="form-control" id="date">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Cerca</button>
                </div>
            </form>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
