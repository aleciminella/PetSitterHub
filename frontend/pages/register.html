<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">PetSitterHub</a>
            <a class="btn btn-outline-primary" href="login.html">Login</a>
        </div>
    </nav>
    <main class="container my-5">
        <section class="auth-section mx-auto">
            <h1 class="h3 mb-4">Crea account</h1>
            <form id="registerForm" class="row g-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Cognome</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="col-12">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="col-md-6">
                    <label for="role" class="form-label">Tipo account</label>
                    <select class="form-select" id="role" required>
                        <option value="">Seleziona</option>
                        <option value="owner">Proprietario</option>
                        <option value="sitter">Pet-sitter</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="city" class="form-label">Citta</label>
                    <input type="text" class="form-control" id="city">
                </div>
                <div class="col-12">
                    <label for="phone" class="form-label">Telefono</label>
                    <input type="tel" class="form-control" id="phone">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">Registrati</button>
                </div>
            </form>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
