<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area admin - PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">PetSitterHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="mainNavbarLinks"></ul>
                <div id="navbarActions" class="d-flex gap-2 ms-lg-3"></div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="mb-1">Area admin</h1>
                <p class="text-muted mb-0">Gestione utenti, sitter e controllo generale della piattaforma.</p>
            </div>
            <button type="button" class="btn btn-outline-primary" id="refreshAdminData">Aggiorna dati</button>
        </div>

        <section class="section-panel mb-4">
            <h2 class="h4 mb-3">Panoramica</h2>
            <div class="row g-3" id="adminStats"></div>
        </section>

        <section class="section-panel mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h2 class="h4 mb-0">Utenti</h2>
                <div class="d-flex flex-wrap gap-2">
                    <select class="form-select admin-sort" id="userSort">
                        <option value="created_at" selected>Data creazione</option>
                        <option value="role">Ruolo</option>
                        <option value="name">Nome</option>
                        <option value="city">Città</option>
                    </select>
                    <input type="search" class="form-control admin-search" id="userSearch" placeholder="Cerca utente">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Utente</th>
                            <th>Ruolo</th>
                            <th>Città</th>
                            <th>Sitter</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTable"></tbody>
                </table>
            </div>
            <button type="button" class="btn btn-outline-primary w-100 mt-3 d-none" id="loadMoreAdminUsers">Mostra altri utenti</button>
        </section>

        <div class="row g-4">
            <div class="col-lg-7">
                <section class="section-panel h-100">
                    <h2 class="h4 mb-3">Ultime prenotazioni</h2>
                    <div class="d-grid gap-2" id="adminBookingsList"></div>
                    <button type="button" class="btn btn-outline-primary w-100 mt-3 d-none" id="loadMoreAdminBookings">Mostra altre prenotazioni</button>
                </section>
            </div>
            <div class="col-lg-5">
                <section class="section-panel h-100">
                    <h2 class="h4 mb-3">Ultime recensioni</h2>
                    <div class="d-grid gap-2" id="adminReviewsList"></div>
                    <button type="button" class="btn btn-outline-primary w-100 mt-3 d-none" id="loadMoreAdminReviews">Mostra altre recensioni</button>
                </section>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
