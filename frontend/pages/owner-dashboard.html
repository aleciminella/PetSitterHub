<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard proprietario - PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">PetSitterHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="mainNavbarLinks"></ul>
                <div id="navbarActions" class="d-flex gap-2 ms-lg-3"></div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <section class="page-heading mb-4">
            <h1>Dashboard proprietario</h1>
            <p class="text-muted mb-0">Gestisci animali e prenotazioni.</p>
        </section>

        <section class="dashboard-grid">
            <div class="dashboard-panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h4 mb-0">I miei animali</h2>
                    <button class="btn btn-outline-primary btn-sm" type="button" id="refreshPetsButton">Aggiorna</button>
                </div>
                <div id="petsMessage" class="alert d-none" role="alert"></div>
                <div id="petsList"></div>
            </div>

            <div class="dashboard-panel">
                <h2 class="h4 mb-3">Aggiungi animale</h2>
                <form id="petForm" class="row g-3">
                    <input type="hidden" id="petId">
                    <div class="col-12">
                        <label for="petName" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="petName" required>
                    </div>
                    <div class="col-12">
                        <label for="petSpecies" class="form-label">Animale</label>
                        <select class="form-select" id="petSpecies" required>
                            <option value="">Seleziona</option>
                            <option value="cane">Cane</option>
                            <option value="gatto">Gatto</option>
                            <option value="uccello">Uccello</option>
                            <option value="roditore">Roditore</option>
                            <option value="rettile">Rettile</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="petBreed" class="form-label">Razza</label>
                        <input type="text" class="form-control" id="petBreed">
                    </div>
                    <div class="col-12">
                        <label for="petNotes" class="form-label">Note</label>
                        <textarea class="form-control" id="petNotes" rows="4"></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="savePetButton">Salva animale</button>
                        <button type="button" class="btn btn-outline-secondary d-none" id="cancelEditPetButton">Annulla modifica</button>
                    </div>
                </form>
            </div>

            <div class="dashboard-panel dashboard-panel-full">
                <h2 class="h4 mb-3">Prenotazioni</h2>
                <div class="empty-state">Le prenotazioni saranno disponibili nel prossimo blocco.</div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/owner-dashboard.js"></script>
</body>
</html>
