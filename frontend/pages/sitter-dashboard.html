<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area sitter - PetSitterHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">PetSitterHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="mainNavbarLinks"></ul>
                <div id="navbarActions" class="d-flex gap-2 ms-lg-3"></div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <section class="page-heading mb-4">
            <h1>Area sitter</h1>
            <p class="text-muted mb-0">Gestisci profilo, animali accettati e servizi offerti.</p>
        </section>

        <section class="dashboard-grid">
            <div class="dashboard-panel">
                <h2 class="h4 mb-3">Profilo sitter</h2>
                <div id="profileMessage" class="alert d-none" role="alert"></div>
                <form id="profileForm" class="row g-3">
                    <div class="col-12">
                        <label for="baseCity" class="form-label">Città base</label>
                        <input type="text" class="form-control" id="baseCity" required>
                    </div>
                    <div class="col-12">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea class="form-control" id="bio" rows="5"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Salva profilo</button>
                    </div>
                </form>
            </div>

            <div class="dashboard-panel">
                <h2 class="h4 mb-3">Animali accettati</h2>
                <div id="petTypesMessage" class="alert d-none" role="alert"></div>
                <form id="petTypesForm">
                    <div id="petTypesList" class="row g-2 mb-3"></div>
                    <button type="submit" class="btn btn-primary">Salva animali</button>
                </form>
            </div>

            <div class="dashboard-panel dashboard-panel-full">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h2 class="h4 mb-1">Servizi e prezzi</h2>
                        <p class="text-muted mb-0">Configura solo i servizi compatibili con gli animali accettati.</p>
                    </div>
                    <button class="btn btn-outline-primary btn-sm" type="button" id="refreshServicesButton">Aggiorna</button>
                </div>
                <div id="servicesMessage" class="alert d-none" role="alert"></div>
                <form id="servicesForm">
                    <div id="sitterServicesList"></div>
                    <button type="submit" class="btn btn-primary mt-3">Salva servizi</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/sitter-dashboard.js"></script>
</body>
</html>
